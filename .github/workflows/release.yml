name: Test RC release
on:
  push:
    tags: ['v*']

permissions:
  contents: read
jobs:
  validate-release:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip "setuptools>=83"
      - run: python -m pip install -e ".[dev,cloud,package]" build pip-audit
      - run: python scripts/check_workflow_pins.py .github/workflows
      - run: python -m compileall -q src tests scripts packaging
      - run: python -m ruff check src tests scripts packaging
      - run: python -m pytest -q
      - run: python -m build --wheel
      - run: python -m pip check
      - run: python -m pip_audit
      - name: Refuse unsafe or oversized staged assets
        shell: bash
        run: |
          test -f RELEASE_ACCEPTANCE.md
          ! git ls-files | grep -E '\.(wav|mp3|m4a|mp4|sqlite3|hws|bin)$'
          if [ -d dist ]; then ! find dist -type f -size +2G -print -quit | grep -q .; fi

# Publishing is intentionally a manual maintainer step after macOS and Windows
# acceptance evidence, checksums and a release manifest have been attached.
