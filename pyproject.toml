[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-studio"
version = "0.3.0rc1"
description = "Privacy-first local desktop transcription application"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "VOICE Studio Project"}]
keywords = ["speech-to-text", "transcription", "whisper", "ukrainian", "czech", "offline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "av>=14,<19",
  "faster-whisper>=1.1,<2",
  "numpy>=1.26,<3",
  "platformdirs>=4.2,<5",
  "pynput>=1.7,<2",
  "sounddevice>=0.5,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-timeout>=2.3,<3",
  "ruff>=0.8,<1",
]
cloud = [
  "keyring>=25,<26",
  "openai>=1.0,<3",
]
benchmark = [
  "psutil>=6,<8",
]
package = [
  "build>=1,<2",
  "pyinstaller>=6.11,<7",
]

[project.scripts]
voice-studio = "voice_studio.cli:main"

[project.gui-scripts]
voice-studio-gui = "voice_studio.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voice_studio = ["resources/*.json"]

[tool.setuptools.data-files]
"share/voice-studio/help" = ["docs/help/*.md", "docs/help/*.json"]
"share/voice-studio/help/assets" = ["docs/help/assets/*.png"]
"share/voice-studio/help/uk" = ["docs/help/uk/*.md"]
"share/voice-studio/help/cs" = ["docs/help/cs/*.md"]
"share/voice-studio/help/en" = ["docs/help/en/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# A hung test must fail the run, not stall it. The whole suite completes in
# seconds, so any test still running after two minutes is wedged. Without this
# a wedged test blocks until the CI job hits its six-hour ceiling and reports
# as cancelled rather than failed.
timeout = 120
# Always summarise skips, so a test that stops running is visible instead of
# silently absent.
addopts = "-rs"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
