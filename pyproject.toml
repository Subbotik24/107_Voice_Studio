[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-voice-studio"
version = "0.3.0rc1"
description = "Privacy-first local transcription desktop app with an integrated Hermes Whisper model laboratory"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Hermes Voice Project"}]
keywords = ["speech-to-text", "transcription", "whisper", "ukrainian", "czech", "offline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "av>=14,<19",
  "faster-whisper>=1.1,<2",
  "numpy>=1.26,<3",
  "platformdirs>=4.2,<5",
  "pynput>=1.7,<2",
  "sounddevice>=0.5,<1",
]

[project.optional-dependencies]
hermes = [
  "torch>=2.4,<3",
  "soundfile>=0.12,<1",
]
train = [
  "torch>=2.4,<3",
  "soundfile>=0.12,<1",
]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-timeout>=2.3,<3",
  "ruff>=0.8,<1",
]
cloud = [
  "keyring>=25,<26",
  "openai>=1.0,<3",
]
benchmark = [
  "psutil>=6,<8",
]
package = [
  "build>=1,<2",
  "pyinstaller>=6.11,<7",
]

[project.scripts]
hermes-voice = "hermes_voice_studio.cli:main"
hermes-whisper = "hermes_whisper.cli:main"

[project.gui-scripts]
hermes-voice-gui = "hermes_voice_studio.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hermes_voice_studio = ["resources/*.json", "resources/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# A hung test must fail the run, not stall it. The whole suite completes in
# seconds, so any test still running after two minutes is wedged. Without this
# a wedged test blocks until the CI job hits its six-hour ceiling and reports
# as cancelled rather than failed.
timeout = 120
# Always summarise skips, so a test that stops running is visible instead of
# silently absent.
addopts = "-rs"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
